# Nixpacks configuration for PRANOVA Healthcare Platform
# Automates dual-package installation (server & admin-web) during container install phase

[phases.install]
cmds = [
  "npm install --include=dev",
  "npm --prefix admin-web install --include=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "node src/scripts/start-production.js"
